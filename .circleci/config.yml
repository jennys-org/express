version: 2.1

commands:
  install-deps:
    steps:
      - restore_cache:
          keys:
            - v1-npm-{{ checksum "package.json" }}
            - v1-npm-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          key: v1-npm-{{ checksum "package.json" }}
          paths:
            - ~/.npm

jobs:
  lint:
    docker:
      - image: cimg/node:26.13.0
    steps:
      - checkout
      - install-deps
      - run:
          name: Lint
          command: npm run lint

  test:
    docker:
      - image: cimg/node:26.13.0
    steps:
      - checkout
      - install-deps
      - run:
          name: Run tests
          command: npm test

workflows:
  build-and-test:
    jobs:
      - lint
      - test:
          requires:
            - lint
