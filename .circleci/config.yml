version: 2.1

commands:
  install-deps:
    description: Install npm dependencies, reusing npm's download cache
    steps:
      - restore_cache:
          keys:
            - v1-npm-{{ arch }}-{{ checksum "package.json" }}
            - v1-npm-{{ arch }}-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          key: v1-npm-{{ arch }}-{{ checksum "package.json" }}
          paths:
            - ~/.npm

jobs:
  lint:
    docker:
      - image: cimg/node:24.13.0
    steps:
      - checkout
      - install-deps
      - run:
          name: Run lint
          command: npm run lint

  test:
    parameters:
      node-version:
        type: string
    docker:
      - image: cimg/node:<< parameters.node-version >>
    steps:
      - checkout
      - install-deps
      - run:
          name: Run tests
          command: npm test

workflows:
  build:
    jobs:
      - lint
      - test:
          matrix:
            parameters:
              node-version: ["18.20.8", "24.13.0"]
          requires:
            - lint
